apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: hms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          ports:
            - containerPort: 8888
          envFrom:
            - configMapRef:
                name: hms-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: hms
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8888
      targetPort: 8888
  type: LoadBalancer
