apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
  namespace: hms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
    spec:
      containers:
        - name: patient-service
          image: patient-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: hms-config
          env:
            - name: DB_URL
              value: "jdbc:postgresql://postgres:5432/patient_service"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hms-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hms-secrets
                  key: DB_PASSWORD

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: patient-service
  namespace: hms
spec:
  selector:
    app: patient-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
