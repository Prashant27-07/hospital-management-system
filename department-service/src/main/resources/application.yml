server:
  port: 8083

spring:
  application:
    name: department-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/department_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
