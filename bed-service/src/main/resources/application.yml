server:
  port: 8087

spring:
  application:
    name: bed-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bed_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

