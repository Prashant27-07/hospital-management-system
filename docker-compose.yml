services:
  # ---------- Infrastructure ----------
  postgres:
    image: postgres:16
    container_name: hms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: hms-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: hms-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: host.docker.internal:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://host.docker.internal:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # ---------- Gateway ----------
  api-gateway:
    build: ./api-gateway
    container_name: hms-api-gateway
    ports:
      - "8888:8888"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AUTH_SERVICE_URL: http://host.docker.internal:8080
      PATIENT_SERVICE_URL: http://host.docker.internal:8081
      DOCTOR_SERVICE_URL: http://host.docker.internal:8082
      DEPARTMENT_SERVICE_URL: http://host.docker.internal:8083
      APPOINTMENT_SERVICE_URL: http://host.docker.internal:8084
      PRESCRIPTION_SERVICE_URL: http://host.docker.internal:8085
    depends_on:
      - auth-service
      - patient-service
      - doctor-service
      - department-service
      - appointment-service
      - prescription-service

  # ---------- Core services ----------
  auth-service:
    build: ./auth-service
    container_name: hms-auth-service
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/auth_service
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktc2VjcmV0LWtleS1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24tMTIzNDU2Nzg=}
    depends_on:
      postgres:
        condition: service_healthy

  patient-service:
    build: ./patient-service
    container_name: hms-patient-service
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/patient_service
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

  doctor-service:
    build: ./doctor-service
    container_name: hms-doctor-service
    ports:
      - "8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/doctor_service
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

  department-service:
    build: ./department-service
    container_name: hms-department-service
    ports:
      - "8083:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/department_service
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

  appointment-service:
    build: ./appointment-service
    container_name: hms-appointment-service
    ports:
      - "8084:8084"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/appointment_service
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: host.docker.internal:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  # ---------- Phase 2 ----------
  prescription-service:
    build: ./prescription-service
    container_name: hms-prescription-service
    ports:
      - "8085:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/prescription_service
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # ---------- Future Phase 2 services ----------
  # admission-service:
  # bed-service:
  # medicine-service:
  # billing-service:
  # payment-service:
  # lab-service:
  # insurance-service:
  # notification-service:
  # audit-service:

volumes:
  pgdata: